<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wilfrombdn's pages</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1b1f24; --muted:#5b636e; --line:#dde1e6; --accent:#2f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1216; --card:#171b21; --text:#e6e9ed; --muted:#9aa3ad; --line:#2a3038; --accent:#5b9bff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:32px 16px 48px; }
  h1 { margin:0 0 4px; font-size:28px; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .grid { display:grid; gap:20px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden;
          display:flex; flex-direction:column; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s; }
  .card:hover { transform:translateY(-2px); border-color:var(--accent); }
  .preview { position:relative; height:190px; overflow:hidden; background:var(--bg); border-bottom:1px solid var(--line); }
  .preview iframe { position:absolute; top:0; left:0; width:400%; height:400%; border:0;
                    transform:scale(.25); transform-origin:0 0; pointer-events:none; }
  .info { padding:14px 16px 16px; }
  .name { font-weight:600; font-size:18px; }
  .desc { color:var(--muted); font-size:14px; margin:4px 0 8px; min-height:1.5em; }
  .meta { font-size:13px; color:var(--muted); display:flex; gap:12px; flex-wrap:wrap; }
  .meta a { color:var(--accent); text-decoration:none; }
  .msg { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>My pages</h1>
  <p class="sub">Every GitHub Pages site from <a href="https://github.com/wilfrombdn">wilfrombdn</a>. New ones show up here automatically.</p>
  <div class="grid" id="grid"><p class="msg">Loading…</p></div>
</main>
<script>
  const USER = "wilfrombdn";
  // Used if the GitHub API can't be reached (e.g. rate limit).
  const FALLBACK = [
    { name: "converter", description: "" },
    { name: "jpront", description: "" },
    { name: "league-radio", description: "Audio-only esports radio for Windows and Android" },
    { name: "police", description: "Android app that detects police cars from the camera" },
  ];

  const grid = document.getElementById("grid");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  function render(repos) {
    repos = repos.filter(r => r.name.toLowerCase() !== `${USER}.github.io`);
    if (!repos.length) { grid.innerHTML = '<p class="msg">No pages yet.</p>'; return; }
    grid.innerHTML = repos.map(r => {
      const url = `https://${USER}.github.io/${r.name}/`;
      const updated = r.pushed_at ? `Updated ${new Date(r.pushed_at).toLocaleDateString()}` : "";
      return `
        <div class="card">
          <a class="preview" href="${url}"><iframe src="${url}" loading="lazy" tabindex="-1" title="${esc(r.name)} preview"></iframe></a>
          <div class="info">
            <a href="${url}" style="color:inherit;text-decoration:none"><div class="name">${esc(r.name)}</div></a>
            <div class="desc">${esc(r.description)}</div>
            <div class="meta">
              <a href="${url}">Open site</a>
              <a href="https://github.com/${USER}/${r.name}">Code</a>
              <span>${updated}</span>
            </div>
          </div>
        </div>`;
    }).join("");
  }

  fetch(`https://api.github.com/users/${USER}/repos?per_page=100&sort=pushed`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(repos => render(repos.filter(r => r.has_pages)))
    .catch(() => render(FALLBACK));
</script>
</body>
</html>
